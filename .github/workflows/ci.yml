name: CI

# Every push to main and every pull request is built and tested. Releasing is separate:
# see release.yml.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Build and test
        run: swift test
